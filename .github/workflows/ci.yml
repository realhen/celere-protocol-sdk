name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  native-execution:
    name: Mainnet programs / Surfpool
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install verified Surfpool 1.6.0
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/surfpool.tar.gz" \
            https://github.com/solana-foundation/surfpool/releases/download/v1.6.0/surfpool-linux-x64.tar.gz
          echo "cb471b00aa3b7d603338eb74ebfec1d23959ecba005b5f1be42ba8d174107fc2  $RUNNER_TEMP/surfpool.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/surfpool-bin"
          tar -xzf "$RUNNER_TEMP/surfpool.tar.gz" -C "$RUNNER_TEMP/surfpool-bin"
          echo "$RUNNER_TEMP/surfpool-bin" >> "$GITHUB_PATH"
      - name: Execute every native builder against mainnet programs
        run: npm run test:surfpool:ci
      - name: Preserve execution and program provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-execution-${{ github.sha }}
          path: outputs/surfpool/
          if-no-files-found: error
          retention-days: 14
